{% set name = "ssh-audit" %}
{% set version = "3.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: f1225d0364b3cb61c7dfb1f5065a6958dbb814d98b2c1dd2a779ba2cdef41f61

build:
  entry_points:
    - ssh-audit = ssh_audit.ssh_audit:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }},<4.0

test:
  imports:
    - ssh_audit
  commands:
    - pip check
    - ssh-audit --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jtesta/ssh-audit
  summary: An SSH server & client configuration security auditing tool
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xhochy
